manifest_version: 1
project: EcuadorElectricGrid
record:
  title: Data of the Electric Network of Ecuador generated by Pypsa Earth
  version: "1.0"
  creator: Fernando Penaherrera
  publication_date: "2026-10-15"
  doi: 10.5281/zenodo.23392049
  concept_doi: 10.5281/zenodo.23392048
  record_url: https://doi.org/10.5281/zenodo.23392049
  license: CC-BY-4.0

stages:
  00_preflight:
    description: Obtain and validate every published external input.
    depends_on: []
  01_demand:
    description: Prepare 2022 hourly electricity demand.
    depends_on: []
  02_generation:
    description: Prepare the 2022 generator fleet.
    depends_on: []
  03_profiles:
    description: Prepare renewable and hydro availability profiles.
    depends_on: []
  04_topology:
    description: Build and validate the 2022 transmission topology.
    depends_on: []
  05_assembly:
    description: Assemble and smoke-test the 2022 network.
    depends_on: [01_demand, 02_generation, 03_profiles, 04_topology]
  06_validation:
    description: Solve and validate the full 2022 year.
    depends_on: [05_assembly]
  07_planning:
    description: Normalize official Master Plan expansion projects.
    depends_on: []
  08_scenario:
    description: Build a student future scenario.
    depends_on: [06_validation, 07_planning]
  09_comparison:
    description: Compare baseline and future scenario results.
    depends_on: [08_scenario]

artifacts:
  - id: pypsa_earth_base_ec
    description: Upstream Ecuador PyPSA-Earth base transmission network.
    stages: [00_preflight, 04_topology]
    destination: data/raw/networks/base.nc
    role: external_input
    availability: external
    source:
      organization: EcuadorElectricGridData
      record: 10.5281/zenodo.23392049
      file: base.nc
    persistent_uri: https://doi.org/10.5281/zenodo.23392049
    download_url: https://zenodo.org/records/23392049/files/base.nc?download=1
    bytes: 1346893
    sha256: 376db45456d13049a9564947f1dac73bf96e6aff09fc5d0b30c07102ad1cf9af
    remote_md5: 37789f94a65bf6b1c9ce7cc202240892
    media_type: application/x-netcdf
    license: CC-BY-4.0
    validation:
      kind: netcdf
      dimensions:
        snapshots: 8760
        buses_i: 313
        lines_i: 247
        transformers_i: 62
      required_variables:
        - snapshots
        - buses_i
        - lines_i
        - transformers_i
      attributes:
        network_name: PyPSA-Earth

  - id: renewable_profile_solar_ec
