manifest_version: 1
project: EcuadorElectricGrid
record:
  title: Data of the Electric Network of Ecuador generated by Pypsa Earth
  version: "1.0"
  creator: Fernando Penaherrera
  publication_date: "2026-10-15"
  doi: 10.5281/zenodo.23392049
  concept_doi: 10.5281/zenodo.23392048
  record_url: https://doi.org/10.5281/zenodo.23392049
  license: CC-BY-4.0

stages:
  00_preflight:
    description: Obtain and validate every published external input.
    depends_on: []
  01_demand:
    description: Prepare 2022 hourly electricity demand.
    depends_on: []
  02_generation:
    description: Prepare the 2022 generator fleet.
    depends_on: []
  03_profiles:
    description: Prepare renewable and hydro availability profiles.
    depends_on: [02_generation]
  04_topology:
    description: Build and validate the 2022 transmission topology.
    depends_on: []
  05_assembly:
    description: Assemble and smoke-test the 2022 network.
    depends_on: [01_demand, 02_generation, 03_profiles, 04_topology]
  06_validation:
    description: Solve and validate the full 2022 year.
    depends_on: [05_assembly]
  07_planning:
    description: Normalize official Master Plan expansion projects.
    depends_on: []
  08_scenario:
    description: Build a student future scenario.
    depends_on: [06_validation, 07_planning]
  09_comparison:
    description: Compare baseline and future scenario results.
    depends_on: [08_scenario]

