# Runtime for the canonical Phase 06H notebooks 00 through 06a.
# Historical pins: docs/ENVIRONMENT.md and Phase 06H executed preflight.
# Reconstruction decisions and excluded legacy tools: docs/ENVIRONMENT_CREATION.md.
# Direct-dependency specification; creation also exports exact resolved builds.
name: pypsa-earth-ec
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11.14
  - pip
  # Scientific stack observed on the original working laptop.
  - pypsa=0.30.3
  - numpy=1.26.4
  - pandas=2.3.3
  - scipy=1.15.2
  - xarray=2025.1.2
  - h5netcdf=1.7.3
  - netcdf4=1.7.3
  - matplotlib=3.10.7
  - plotly=6.3.1
  - geopandas=1.1.1
  - networkx>=3,<4
  - seaborn>=0.13,<0.14
  # Explicit solver and modeling layer; Linopy is a reconstruction choice.
  - linopy=0.5.8
  - highspy=1.11.0
  # Artifact manifest, schemas, downloads and environment checks.
  - pyyaml=6.0.3
  - requests=2.32.5
  - jsonschema=4.25.1
  - packaging>=24,<26
  # Notebook execution and VS Code kernel/debugger support.
  - ipykernel>=6.29,<7
  - ipython>=8.26,<9
  - jupyterlab>=4,<5
  - jupyter_client>=8,<9
  - nbclient=0.10.2
  - nbformat=5.10.4
  - debugpy>=1.8,<2
